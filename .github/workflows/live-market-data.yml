name: Refresh live ETF market data

on:
  workflow_dispatch:
  schedule:
    # Fixed 22:00 CET (UTC+1) year-round; no CEST adjustment.
    - cron: '0 21 * * *'

concurrency:
  group: live-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and stage live market data
        env:
          SWISS_QUOTE_URL_TEMPLATE: ${{ secrets.SWISS_QUOTE_URL_TEMPLATE }}
        run: python -m etf_ingestion_backend.live_cli --config data/live_price_config.json --output data/live_prices.json

      - name: Validate staged artifact
        run: python -c "import json; from pathlib import Path; from etf_ingestion_backend.live_market_data import LivePricesArtifact; LivePricesArtifact.from_dict(json.loads(Path('data/live_prices.json').read_text(encoding='utf-8')))"

      - name: Commit validated update
        shell: bash
        run: |
          if git diff --quiet -- data/live_prices.json; then
            echo "No live market data changes detected."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live_prices.json
          git commit -m "Refresh live ETF market data $(date -u +%F)"
          git push

      - name: Publish GitHub Pages
        if: success()
        shell: pwsh
        run: ./scripts/publish-gh-pages.ps1
