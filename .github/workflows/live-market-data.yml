name: Refresh live ETF market data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-market-data.yml'
      - 'data/live_price_config.json'
      - 'etf_ingestion_backend/**'
      - 'scripts/publish-gh-pages.ps1'
      - 'README.md'
  workflow_dispatch:
  schedule:
    # Fixed 22:00 CET (UTC+1) year-round; no CEST adjustment.
    - cron: '0 21 * * *'

concurrency:
  group: live-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and stage live market data
        env:
          SWISS_QUOTE_URL_TEMPLATE: ${{ secrets.SWISS_QUOTE_URL_TEMPLATE }}
          YAHOO_QUOTE_URL_TEMPLATE: ${{ secrets.YAHOO_QUOTE_URL_TEMPLATE }}
        run: python -m etf_ingestion_backend.live_cli --config data/live_price_config.json --output data/live_prices.json

      - name: Validate staged artifact
        run: python -c "import json; from pathlib import Path; from etf_ingestion_backend.live_market_data import LivePricesArtifact; LivePricesArtifact.from_dict(json.loads(Path('data/live_prices.json').read_text(encoding='utf-8')))"

      - name: Publish GitHub Pages
        if: success()
        shell: pwsh
        run: ./scripts/publish-gh-pages.ps1
